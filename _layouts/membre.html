---
layout: default
---
<article class="min-h-screen pt-24 px-6 pb-16 max-w-2xl mx-auto text-center">
  <a
    href="/#about"
    data-back
    class="inline-flex items-center gap-2 text-sm uppercase tracking-widest text-neutral-500 hover:text-neutral-100 transition-colors mb-12"
  >
    <svg
      width="16"
      height="16"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
    >
      <path d="M19 12H5M12 5l-7 7 7 7"/>
    </svg>
    À propos
  </a>

  <div
    class="w-80 h-80 mx-auto mb-8 overflow-hidden border-2 border-neutral-800"
    style="view-transition-name: membre-{{ page.slug }};"
  >
    <img
      src="{{ page.photo | relative_url }}"
      alt="{{ page.title }}"
      class="w-full h-full object-cover"
    >
  </div>

  <h1 class="font-display text-4xl md:text-5xl font-bold mb-8">{{ page.title }}</h1>

  <div class="prose prose-invert prose-lg max-w-none text-neutral-400 text-left">
    {{ content }}
  </div>
</article>
<script>
  const backLink = document.querySelector('a[data-back]');
  if (backLink) {
    backLink.addEventListener('click', (e) => {
      e.preventDefault();
      history.back();
    });
  }
</script>
