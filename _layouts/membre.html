---
layout: default
---
<article class="min-h-screen pt-24 px-6 pb-16 max-w-5xl mx-auto">
  <a
    href="/#about"
    data-back
    class="inline-flex items-center gap-2 text-sm uppercase tracking-widest text-neutral-500 hover:text-neutral-100 transition-colors mb-12"
  >
    <svg
      width="16"
      height="16"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
    >
      <path d="M19 12H5M12 5l-7 7 7 7"/>
    </svg>
    À propos
  </a>

  <div class="grid md:grid-cols-2 gap-12 items-start">
    <div
      class="w-full aspect-square overflow-hidden border-2 border-neutral-800"
      style="view-transition-name: membre-{{ page.slug }};"
    >
      <img
        src="{{ page.photo | relative_url }}"
        alt="{{ page.title }}"
        class="w-full h-full object-cover"
      >
    </div>

    <div>
      <h1 class="font-display text-4xl md:text-5xl font-bold mb-8">{{ page.title }}</h1>

      <div class="prose prose-invert prose-lg max-w-none text-neutral-400">
        {{ content }}
      </div>
    </div>
  </div>
</article>
<script>
  document.querySelector('a[data-back]')?.addEventListener('click', (e) => {
    if (window.history.length > 1) {
      e.preventDefault();
      window.history.back();
    }
  });
</script>
