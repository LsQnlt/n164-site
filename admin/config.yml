backend:
  name: github
  repo: LsQnlt/n164-site
  branch: main

media_folder: "assets/images"
public_folder: "/assets/images"

collections:
  - name: "films"
    label: "Films"
    folder: "_films"
    create: true
    fields:
      - { label: "Titre", name: "title", widget: "string" }
      - { label: "Image", name: "image", widget: "image" }
      - { label: "Catégorie", name: "category", widget: "select", options: ["documentaire", "atelier", "film-sur-mesure", "podcast", "expo"] }
      - { label: "Description", name: "body", widget: "markdown" }