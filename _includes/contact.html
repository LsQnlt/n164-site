<section class="reveal px-6 py-24 md:py-32" id="contact">
  <h2 class="font-display text-4xl md:text-5xl font-bold mb-16">Contact</h2>

  <div class="text-center">
    {% if site.data.contact.email %}
      <a
        href="mailto:{{ site.data.contact.email }}"
        class="inline-block text-5xl font-bold pt-1 pb-4 scale-x-115 rounded-full px-6 mb-8 hover:bg-neutral-100 hover:text-neutral-950 hover:border-neutral-100 transition-colors"
      >
        @
      </a>
    {% endif %}

    <div class="flex justify-center gap-8 mb-24">
      {% if site.data.contact.instagram %}
        <a
          href="{{ site.data.contact.instagram }}"
          target="_blank"
          rel="noopener"
          class="opacity-70 hover:opacity-100 hover:-translate-y-0.5 transition-all"
          aria-label="Instagram"
        >
          <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/>
          </svg>
        </a>
      {% endif %}

      {% if site.data.contact.facebook %}
        <a
          href="{{ site.data.contact.facebook }}"
          target="_blank"
          rel="noopener"
          class="opacity-70 hover:opacity-100 hover:-translate-y-0.5 transition-all"
          aria-label="Facebook"
        >
          <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
            <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
          </svg>
        </a>
      {% endif %}

      {% if site.data.contact.soundcloud %}
        <a
          href="{{ site.data.contact.soundcloud }}"
          target="_blank"
          rel="noopener"
          class="opacity-70 hover:opacity-100 hover:-translate-y-0.5 transition-all"
          aria-label="Soundcloud"
        >
          <svg width="30" height="30" viewBox="0 0 24 24" fill="currentColor">
            <path d="M1.175 12.225c-.051 0-.094.046-.101.1l-.233 2.154.233 2.105c.007.058.05.098.101.098.05 0 .09-.04.099-.098l.255-2.105-.27-2.154c-.009-.058-.05-.1-.1-.1zm-.899 1.065c-.051 0-.09.037-.099.09l-.176 1.09.176 1.096c.009.053.048.09.099.09.05 0 .091-.037.099-.09l.201-1.096-.201-1.09c-.008-.053-.049-.09-.099-.09zm1.8-.945c-.061 0-.104.056-.112.109l-.209 1.984.209 2.025c.008.057.051.107.112.107.06 0 .104-.05.113-.107l.238-2.025-.238-1.984c-.009-.057-.053-.109-.113-.109zm.899-.427c-.067 0-.117.063-.123.119l-.192 2.365.192 2.407c.006.059.056.119.123.119.065 0 .117-.06.123-.119l.215-2.407-.215-2.365c-.006-.056-.058-.119-.123-.119zm.901-.263c-.073 0-.124.069-.131.131l-.175 2.598.175 2.613c.007.066.058.131.131.131s.124-.065.131-.131l.199-2.613-.199-2.598c-.007-.062-.058-.131-.131-.131zm.924-.263c-.078 0-.131.075-.137.143l-.158 2.861.158 2.862c.006.068.059.143.137.143.076 0 .131-.075.137-.143l.181-2.862-.181-2.861c-.006-.068-.061-.143-.137-.143zm.922-.107c-.084 0-.139.082-.143.149l-.141 2.968.141 2.969c.004.071.059.149.143.149.084 0 .139-.078.145-.149l.16-2.969-.16-2.968c-.006-.067-.061-.149-.145-.149zm.93.028c-.088 0-.145.086-.149.153l-.124 2.787.124 2.813c.004.071.061.153.149.153s.145-.082.151-.153l.14-2.813-.14-2.787c-.006-.067-.063-.153-.151-.153zm.92-.159c-.094 0-.151.092-.155.163l-.108 2.946.108 2.964c.004.075.061.163.155.163.092 0 .151-.088.155-.163l.123-2.964-.123-2.946c-.004-.071-.061-.163-.155-.163zm2.89-2.909c-.2 0-.394.025-.584.074C11.823 7.663 9.647 6 7.106 6c-.65 0-1.287.134-1.875.386-.248.105-.313.213-.317.422v8.876c.004.216.172.394.39.407h7.696c1.658 0 3-1.344 3-3.002 0-1.658-1.342-3.002-3-3.002z"/>
          </svg>
        </a>
      {% endif %}
    </div>
  </div>

  <footer class="pt-16 border-t border-neutral-800 text-sm text-neutral-500">
    <p>&copy; {{ 'now' | date: '%Y' }} N164 Collectif</p>
  </footer>
</section>
