<section
  class="min-h-screen flex flex-col justify-center items-center text-center relative bg-gradient-radial from-neutral-900 to-neutral-950"
  id="hero"
>
  <video
    autoplay
    muted
    loop
    playsinline
    class="absolute inset-0 w-full h-full object-cover z-0"
  >
    <source src="/assets/teaser_n164_compressed.webm" type="video/webm">
    <source src="/assets/teaser_n164_compressed.mp4" type="video/mp4">
  </video>

  <div class="title opacity-0">
    <h1 class="font-title text-7xl md:text-9xl font-extrabold tracking-wide mb-4">N164</h1>
    <p class="text-sm uppercase tracking-[0.3em] text-neutral-500">Fabrique d'histoires</p>
  </div>
  <a
    href="#films"
    class="absolute bottom-8 z-10 flex flex-col items-center gap-2 text-xs uppercase tracking-widest text-white animate-bounce no-underline"
  >
    <span>Découvrir</span>
    <svg
      width="24"
      height="24"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
    >
      <path d="M12 5v14M5 12l7 7 7-7"/>
    </svg>
  </a>
</section>
<style>
  #hero video {
    view-transition-name: none;
  }
  #hero .title {
    transition: opacity 0.1s linear;
    position: relative;
    z-index: 10;
  }
</style>
<script>
  document.querySelector('#hero a[href="#films"]')?.addEventListener('click', (e) => {
    e.preventDefault();
    document.querySelector('#films')?.scrollIntoView({ behavior: 'smooth' });
  });

  const heroVideo = document.querySelector('#hero video');
  const heroTitle = document.querySelector('#hero .title');

  function syncTitle() {
    if (!heroVideo?.duration) return;
    const t = heroVideo.currentTime;
    const d = heroVideo.duration;

    let opacity;
    if (t < 6.5) opacity = 0;
    else if (t < 10.5) opacity = (t - 6.5) / 4;
    else if (t < d - 2) opacity = 1;
    else opacity = Math.max(0, 1 - (t - (d - 2)) / 2);

    heroTitle.style.opacity = opacity;
  }

  heroVideo?.addEventListener('timeupdate', syncTitle);

  function restartHero() {
    if (heroVideo) {
      heroVideo.load();
      heroVideo.play().catch(() => {});
    }
  }

  window.addEventListener('pageshow', (e) => {
    if (e.persisted) restartHero();
  });
</script>
