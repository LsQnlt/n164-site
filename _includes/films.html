<section id="films" class="w-full">
  <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4">
    {% for film in site.films %}
      <a
        href="#"
        class="film-card group relative aspect-video overflow-hidden"
        data-film="{{ film.title | slugify }}"
      >
        <img
          src="{{ film.image | relative_url }}"
          alt="{{ film.title }}"
          class="absolute inset-0 w-full h-full object-cover transition-transform duration-500 group-hover:scale-105"
        >
        <div
          class="absolute inset-0 bg-black/40 group-hover:bg-black/60 transition-colors duration-300"
        ></div>
        <div class="absolute inset-0 flex flex-col items-center justify-center">
          <h3 class="font-display text-lg md:text-xl font-bold text-center px-4 text-white">
            {{ film.title }}
          </h3>
          <span class="text-xs uppercase tracking-widest text-neutral-400 mt-1">
            {{ film.category }}
          </span>
        </div>
      </a>
    {% endfor %}
  </div>
</section>
