<section id="films" class="reveal w-full scroll-mt-22">
  {% assign sorted_films = site.films | sort: 'order' %}
  {% assign unsorted_films = site.films | where_exp: 'film', 'film.order == nil' %}
  {% assign all_films = sorted_films | concat: unsorted_films %}
  <div class="flex flex-wrap justify-center">
    {% for film in all_films %}
      <a
        href="{{ film.url | relative_url }}"
        class="film-card reveal-child group relative aspect-video overflow-hidden w-1/2 md:w-1/3 lg:w-1/4 border-[1px] border-black"
        data-film="{{ film.title | slugify }}"
      >
        <img
          src="{{ film.image | relative_url }}"
          alt="{{ film.title }}"
          class="absolute inset-0 w-full h-full object-cover ease-[cubic-bezier(0.25,0.46,0.45,0.94)] group-hover:scale-[1.08] transition-transform duration-300"
          style="view-transition-name: film-{{ film.slug }};"
        >
        <div
          class="absolute inset-0 bg-linear-to-t from-black/85 via-black/20 to-transparent group-hover:from-black/92 group-hover:via-black/35 transition-all duration-400"
        ></div>
        <div class="absolute bottom-0 left-0 right-0 p-4 translate-y-1 group-hover:translate-y-0 transition-transform duration-400">
          <h3 class="font-display text-base md:text-lg font-semibold text-white leading-tight mb-1">
            {{ film.title }}
          </h3>
          <span class="text-[13px] uppercase tracking-[0.18em] text-white/90 opacity-0 translate-y-1.5 group-hover:opacity-100 group-hover:translate-y-0 transition-all duration-300 delay-75 block">
            {{ film.category }}
          </span>
        </div>
        <div
          class="absolute bottom-0 left-0 h-0.5 bg-white w-0 group-hover:w-full transition-all duration-400"
        ></div>
      </a>
    {% endfor %}
  </div>
</section>
<script>
  const skipReveal = performance.getEntriesByType('navigation')[0]?.type === 'back_forward';

  if (skipReveal) {
    document
      .querySelectorAll('.reveal, .reveal-child')
      .forEach((el) => el.classList.add('visible'));
  }
</script>
