<section class="reveal px-6 py-24 md:py-32 bg-neutral-900" id="about">
  <div class="max-w-3xl mb-16">
    <h2 class="font-display text-4xl md:text-5xl font-bold mb-8">À propos</h2>
    {% if site.data.about.intro %}
      <div class="text-lg leading-relaxed text-neutral-400">
        {{ site.data.about.intro | markdownify }}
      </div>
    {% else %}
      <p class="text-lg leading-relaxed text-neutral-400">
        Collectif de vidéastes basé en Bretagne.
      </p>
    {% endif %}
  </div>

  <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-8">
    {% for membre in site.membres %}
      <a href="{{ membre.url | relative_url }}" class="reveal-child text-center group">
        <div
          class="w-36 h-36 mx-auto mb-4 rounded-full overflow-hidden border-2 border-neutral-800"
          style="view-transition-name: membre-{{ membre.slug }};"
        >
          <img
            src="{{ membre.photo | relative_url }}"
            alt="{{ membre.title }}"
            class="w-full h-full object-cover"
          >
        </div>
        <h3 class="font-display text-xl font-semibold mb-2 group-hover:text-neutral-300 transition-colors">
          {{ membre.title }}
        </h3>
      </a>
    {% endfor %}
  </div>
</section>
