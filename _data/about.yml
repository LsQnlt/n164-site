intro: |-
  N164 est un
  collectif de réalisateurs.

  La N164, c’est la
  route qui relie la Bretagne d’est en ouest par son centre. Ce sont
  nos territoires, nous y portons un regard singulier sur les vies et
  les histoires qui le composent. C’est de là que nous voulons
  transmettre.

  Auteurs de
  documentaires, courts-métrage, clips, captations, podcasts,
  reportages ou installations vidéos, nous proposons des projets
  d’action culturelle, ainsi que des temps de formation et de
  sensibilisation. 

  Bon on a encore deux
  trois paragaphe à écrire comme tu vois...
